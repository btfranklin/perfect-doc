[build-system]
requires = ["maturin>=1.15.0"]
build-backend = "maturin"

[project]
name = "perfect-doc"
dynamic = ["version"]
description = "Structural validation for complete documentation collections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "B.T. Franklin" }]

[tool.maturin]
bindings = "bin"
strip = true

[tool.pdm]
distribution = true
[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
]
